[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aes-gcm-file-encryption"
version = "1.0.0"
description = "Cifrado autenticado de archivos con AES-256-GCM por bloques y derivación de clave scrypt."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Andrey Herrera Silva", email = "kahs_kevin@hotmail.com" }]
requires-python = ">=3.12"
keywords = ["aes", "aes-gcm", "file-encryption", "scrypt", "authenticated-encryption"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=50",
]

[project.scripts]
aes-files = "aes_files.cli:main"

[project.urls]
Repository = "https://github.com/KevinAndrey96/python-aes-gcm-file-encryption"

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aes_files"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "N", "PL", "ARG", "RET"]
ignore = ["PLR2004"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["aes_files"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
